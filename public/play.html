<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="YunPlayer - 在线播放" />
  <title>YunPlayer · 播放</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><path d='M38 30l34 20-34 20z' fill='white'/></svg>" />
  <!-- 提前应用已保存的模板风格，避免刷新时闪烁 -->
  <script>try{if(localStorage.getItem("yunplayer_theme")==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <nav class="nav">
    <a class="logo" href="/">YunPlayer</a>
    <div class="nav-links"><a href="/">← 返回搜索</a></div>
  </nav>

  <div class="page">
    <h1 class="play-title" id="playTitle">加载中…</h1>
    <div class="play-meta" id="playMeta"></div>

    <div class="player" id="player">
      <div class="placeholder" id="placeholder">
        <div class="spin"></div>
        <span>正在解析播放地址…</span>
      </div>
    </div>

    <div class="section" id="jxSection" style="display:none">
      <div class="section-hd">解析线路</div>
      <div class="episodes" id="jxTabs"></div>
    </div>

    <div class="section" id="sourceSection" style="display:none">
      <div class="section-hd">播放线路</div>
      <div class="episodes" id="sourceTabs"></div>
    </div>

    <div class="section" id="epSection" style="display:none">
      <div class="section-hd">选集</div>
      <div class="episodes" id="episodes"></div>
    </div>

    <footer class="footer">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="footer-name" data-site-copy>YunPlayer</span>
          <span class="footer-tagline">聚合全网影视资源 · 智能解析 · 高清在线观看</span>
        </div>
        <nav class="footer-nav">
          <a href="/">首页</a>
          <a href="https://github.com/lovehaiyun/YunPlayer" data-foot-link target="_blank" rel="noopener noreferrer">开源地址</a>
        </nav>
      </div>
      <p class="footer-note" data-foot-note>本站为技术演示站点，不存储、不制作、不提供任何影视资源，全部内容均来自第三方公开接口，版权归原权利人所有；如相关内容侵犯了您的合法权益，请通过页脚的开源地址与我们联系，核实后将及时处理。</p>
      <div class="footer-meta">
        <span data-foot-copyright>© 2026 YunPlayer 版权所有</span>
        <span data-foot-icp>京ICP备00000000号</span>
        <span data-foot-extra>本站仅供技术学习与研究使用</span>
      </div>
    </footer>
  </div>

  <script src="/lib/hls.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
